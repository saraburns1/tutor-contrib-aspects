name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and validate the package without publishing to PyPI'
        required: false
        default: true
        type: boolean

env:
  TUTOR_ROOT: ./.ci/

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && startsWith(github.head_ref, 'bot/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Read version from package
        id: read_version
        run: |
          RAW_V=$(grep -Eo "[0-9]+\.[0-9]+\.[0-9]+" tutoraspects/__about__.py | head -n 1)
          echo "raw_version=${RAW_V}" >> $GITHUB_OUTPUT
          echo "tag=v${RAW_V}" >> $GITHUB_OUTPUT

      - name: Create GitHub tag
        # Skip if tag already exists (e.g. re-running after a partial failure)
        run: |
          TAG="${{ steps.read_version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.read_version.outputs.tag }}
          name: Release ${{ steps.read_version.outputs.tag }}
          bodyFile: CHANGELOG.md
          skipBodyUpdate: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements/pip.txt

      - name: Build package
        run: make build-pythonpackage

      - name: Validate package
        run: |
          pip install twine
          twine check dist/*

      - name: Publish to PyPI
        if: >
          github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_UPLOAD_TOKEN }}
