name: Bump Version (Manually)

on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: 'The previous release tag to base this new version on (e.g., v1.4.2)'
        required: true
      bump_type:
        description: 'SemVer increment type'
        required: true
        default: 'patch'
        type: choice
        options: [patch, minor, major]

jobs:
  prepare-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Targeted Branch Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0 

      - name: Force Fetch Tags and Remote History
        run: |
          git fetch --tags --force origin
          git fetch origin ${{ github.ref_name }}

      - name: Calculate Next Version
        id: semver
        run: |
          BASE="${{ inputs.base_tag }}"
          CLEAN_VER="${BASE#v}"
          IFS='.' read -r major minor patch <<< "$CLEAN_VER"
          
          if [ "${{ inputs.bump_type }}" = "major" ]; then major=$((major + 1)); minor=0; patch=0
          elif [ "${{ inputs.bump_type }}" = "minor" ]; then minor=$((minor + 1)); patch=0
          else patch=$((patch + 1)); fi
          
          NEXT_VERSION="v$major.$minor.$patch"
          if git rev-parse "$NEXT_VERSION" >/dev/null 2>&1; then
            echo "Error: Target version '$NEXT_VERSION' already exists." && exit 1
          fi
          echo "new_tag=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "raw_version=$major.$minor.$patch" >> $GITHUB_OUTPUT

      - name: Update Version in Project Files
        run: |
          NEW_V="${{ steps.semver.outputs.raw_version }}"
          sed -i -E "s/(__version__ *= *['\"])[^'\"]*(['\"])/\1$NEW_V\2/g" "tutoraspects/__about__.py"
          sed -i -E "s/(ASPECTS_VERSION\s*:\s*)[0-9]+\.[0-9]+\.[0-9]+/\1$NEW_V/g" ".ci/config.yml"

      - name: Process Changelog Delta and Update Files
        id: git_changelog
        shell: python
        run: |
          import subprocess, os, re
          from datetime import datetime

          base, new = "${{ inputs.base_tag }}", "${{ steps.semver.outputs.new_tag }}"
          repo_url = "https://github.com{{ github.repository }}"
          
          # Safely fetch git log commits since the base tag
          log_output = subprocess.check_output(["git", "log", f"{base}..HEAD", "--oneline"]).decode('utf-8')
          
          groups = {"Features": [], "Bug Fixes": [], "Maintenance & Refactoring": [], "Miscellaneous Updates": []}
          
          for line in filter(None, log_output.splitlines()):
              msg = line.split(" ", 1)[1]
              
              # Extract PR number if present
              pr_match = re.search(r'#(\d+)', msg)
              
              if pr_match:
                  pr_num = pr_match.group(1)
                  # Formats a clean markdown hyperlink to the specific pull request number
                  pr_suffix = f" ([#{pr_num}]({repo_url}/pull/{pr_num}))"
              else:
                  pr_suffix = ""
              
              # Clean default GitHub merge messages to isolate the actual commit reason
              if msg.startswith("Merge pull request"):
                  msg = msg.split(" from ")[-1].split("\n")[0]
              
              # Clean any raw numbers inside the core message text to prevent duplicating it
              clean_msg = re.sub(r'\s*\(?#\d+\)?', '', msg).strip()
              bullet = f"- {clean_msg}{pr_suffix}"
              
              if re.search(r'^feat', clean_msg, re.I): groups["Features"].append(bullet)
              elif re.search(r'^fix|^bug', clean_msg, re.I): groups["Bug Fixes"].append(bullet)
              elif re.search(r'^chore|^docs|^refactor', clean_msg, re.I): groups["Maintenance & Refactoring"].append(bullet)
              else: groups["Miscellaneous Updates"].append(bullet)

          # Compile Entry Block using clean headers
          entry = f"## Changes since release {base}\n"
          for title, items in groups.items():
              if items: entry += f"\n### {title}\n" + "\n".join(items) + "\n"

          # Write to runner environment variables safely for the PR body
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"BODY<<EOF\n{entry.strip()}\nEOF\n")

          # Splicing CHANGELOG.md precisely below line 7
          c_file = "CHANGELOG.md"
          lines = open(c_file).readlines() if os.path.exists(c_file) else []
          while len(lines) < 7: lines.append("\n")
          
          date_str = datetime.now().strftime("%Y-%m-%d")
          file_block = f"# Release {new} ({date_str})\n" + entry.replace(f"## Changes since release {base}\n", "")
          
          updated_content = "".join(lines[:7]) + "\n" + file_block.strip() + "\n\n---\n\n" + "".join(lines[7:])
          open(c_file, "w").write(updated_content)

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump version to ${{ steps.semver.outputs.raw_version }} and update CHANGELOG [skip ci]"
          base: ${{ github.ref_name }} 
          branch: "release/${{ steps.semver.outputs.new_tag }}"
          title: "Release ${{ steps.semver.outputs.new_tag }}"
          body: |
            This PR prepares the release for version **${{ steps.semver.outputs.new_tag }}** branching from base version `${{ inputs.base_tag }}`.
            
            Once merged, the publication pipeline will trigger automatically.
            
            ### Proposed Release Notes:
            ${{ steps.git_changelog.outputs.BODY }}
          labels: |
            release-pr
