name: Bump Version (Manually)

on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: 'The previous release tag to base this new version on (e.g., v1.4.2)'
        required: true

jobs:
  prepare-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Targeted Branch Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0 

      - name: Force Fetch Tags and Remote History
        run: |
          git fetch --tags --force origin
          git fetch origin ${{ github.ref_name }}

      - name: Process Version Calculation and Changelog
        id: git_changelog
        shell: python
        run: |
          import subprocess, os, re, sys
          from datetime import datetime

          base = "${{ inputs.base_tag }}"
          repo_url = "https://github.com{{ github.repository }}"
          
          if subprocess.call(["git", "rev-parse", base], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL) != 0:
              print(f"::error::Base tag {base} does not exist in local git history.")
              sys.exit(1)
          
          # 1. Fetch git commits to parse messages
          log_output = subprocess.check_output(["git", "log", f"{base}..HEAD", "--oneline"]).decode('utf-8')
          
          groups = {"Features": [], "Bug Fixes": [], "Maintenance & Refactoring": [], "Miscellaneous Updates": []}
          bump_decision = "patch" 

          for line in filter(None, log_output.splitlines()):
              parts = line.split(" ", 1)
              if len(parts) < 2:
                  continue
              sha, working_msg = parts[0], parts[1].strip()
              
              # Automatically calculate version bump based on conventional commit standards
              if "BREAKING CHANGE" in working_msg or re.search(r'^[a-z]+!(\(.*\))?:', working_msg):
                  bump_decision = "major"
              elif working_msg.startswith("feat") and bump_decision != "major":
                  bump_decision = "minor"

              # Format entries with linkified PR numbers
              pr_match = re.search(r'#(\d+)', working_msg)
              pr_suffix = f" ([#{pr_match.group(1)}]({repo_url}/pull/{pr_match.group(1)}))" if pr_match else ""
              
              if working_msg.startswith("Merge pull request"):
                  split_parts = working_msg.split(" from ")
                  if len(split_parts) > 1:
                      working_msg = split_parts[-1].split("\n")[0]
              
              clean_msg = re.sub(r'\s*\(?#\d+\)?', '', working_msg).strip()
              bullet = f"- {clean_msg}{pr_suffix}"
              
              if re.search(r'^feat', clean_msg, re.I): groups["Features"].append(bullet)
              elif re.search(r'^fix|^bug', clean_msg, re.I): groups["Bug Fixes"].append(bullet)
              elif re.search(r'^chore|^docs|^refactor', clean_msg, re.I): groups["Maintenance & Refactoring"].append(bullet)
              else: groups["Miscellaneous Updates"].append(bullet)

          # 2. Complete Mathematical SemVer Bump Calculations
          clean_base = base.lstrip('v')
          major, minor, patch = map(int, clean_base.split('.'))
          
          if bump_decision == "major": major, minor, patch = major + 1, 0, 0
          elif bump_decision == "minor": minor, patch = minor + 1, 0
          elif bump_decision == "patch": patch += 1

          new_tag = f"v{major}.{minor}.{patch}"
          raw_version = f"{major}.{minor}.{patch}"

          if subprocess.call(["git", "rev-parse", new_tag], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL) == 0:
              print(f"::error::Calculated target version '{new_tag}' already exists.")
              sys.exit(1)

          # 3. Update tutoraspects/__about__.py and .ci/config.yml inline with fresh atomic writes
          py_file, yaml_file = "tutoraspects/__about__.py", ".ci/config.yml"
          
          for f_path in [py_file, yaml_file]:
              if not os.path.exists(f_path):
                  print(f"::error::Required file {f_path} not found!")
                  sys.exit(1)

          with open(py_file, 'r') as f:
              py_content = re.sub(r"(__version__ *= *['\"])[^'\"]*(['\"])", f"\\1{raw_version}\\2", f.read())
          with open(py_file, 'w') as f:
              f.write(py_content)

          with open(yaml_file, 'r') as f:
              yaml_content = re.sub(r"(ASPECTS_VERSION\s*:\s*)[0-9]+\.[0-9]+\.[0-9]+", f"\\1{raw_version}", f.read())
          with open(yaml_file, 'w') as f:
              f.write(yaml_content)

          # 4. Assemble Changelog String
          entry = f"## Changes since release {base}\n"
          for title, items in groups.items():
              if items: entry += f"\n### {title}\n" + "\n".join(items) + "\n"

          # Write environment parameters out safely using multiline EOF blocks
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"new_tag={new_tag}\n")
              f.write(f"raw_version={raw_version}\n")
              f.write(f"BODY<<EOF\n{entry.strip()}\nEOF\n")

          # 5. Splice entries into CHANGELOG.md precisely at line 8
          c_file = "CHANGELOG.md"
          lines = open(c_file).readlines() if os.path.exists(c_file) else []
          while len(lines) < 7: lines.append("\n")
          
          date_str = datetime.now().strftime("%Y-%m-%d")
          file_block = f"# Release {new_tag} ({date_str})\n" + entry.replace(f"## Changes since release {base}\n", "")
          
          updated_content = "".join(lines[:7]) + "\n" + file_block.strip() + "\n\n---\n\n" + "".join(lines[7:])
          with open(c_file, "w") as f:
              f.write(updated_content)

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump version to ${{ steps.git_changelog.outputs.raw_version }} and update CHANGELOG [skip ci]"
          base: ${{ github.ref_name }} 
          branch: "release/${{ steps.git_changelog.outputs.new_tag }}"
          title: "Release ${{ steps.git_changelog.outputs.new_tag }}"
          body: |
            This PR prepares the release for version **${{ steps.git_changelog.outputs.new_tag }}** branching from base version `${{ inputs.base_tag }}`.
            
            The SemVer bump type was automatically calculated by parsing conventional commits merged into this branch.
            
            Once merged, the publication pipeline will trigger automatically.
            
            ### Proposed Release Notes:
            ${{ steps.git_changelog.outputs.BODY }}
          labels: |
            release-pr
