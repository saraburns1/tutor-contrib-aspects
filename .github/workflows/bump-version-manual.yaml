name: Bump Version (Manually)

on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: 'The previous release tag to base this new version on (e.g., v1.4.2)'
        required: true

jobs:
  prepare-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Targeted Branch Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0 

      - name: Force Fetch Tags and Remote History
        run: |
          git fetch --tags --force origin
          git fetch origin ${{ github.ref_name }}

      - name: Calculate Version and Process Changelog (Pure Bash)
        id: git_changelog
        run: |
          BASE="${{ inputs.base_tag }}"
          REPO_URL="https://github.com{{ github.repository }}"
          CURRENT_DATE=$(date +%Y-%m-%d)
          
          if ! git rev-parse "$BASE" >/dev/null 2>&1; then
            echo "::error::Base tag $BASE does not exist in local git history."
            exit 1
          fi
          
          # Initialize string memory trackers
          FEAT_CHANGES=""
          FIX_CHANGES=""
          CHORE_CHANGES=""
          MISC_CHANGES=""
          BUMP_DECISION="patch"
          
          # Read git log line-by-line entirely in memory stream
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            
            SHA=$(echo "$line" | awk '{print $1}')
            RAW_MSG=$(echo "$line" | sed -E 's/^[a-f0-9]+ //')
            
            # 1. Evaluate Conventional Commits for Version Bumping
            if echo "$RAW_MSG" | grep -q "BREAKING CHANGE" || echo "$RAW_MSG" | grep -E -q '^[a-z]+!(\(.*\))?:'; then
              BUMP_DECISION="major"
            elif echo "$RAW_MSG" | grep -q "^feat" && [ "$BUMP_DECISION" != "major" ]; then
              BUMP_DECISION="minor"
            fi
            
            # 2. Extract and format the Pull Request link suffix safely
            if echo "$RAW_MSG" | grep -E -q '#[0-9]+'; then
              PR_NUM=$(echo "$RAW_MSG" | grep -E -o '#[0-9]+' | head -n 1 | tr -d '#')
              PR_SUFFIX=" ([#${PR_NUM}](${REPO_URL}/pull/${PR_NUM}))"
            else
              PR_SUFFIX=""
            fi
            
            # Clean standard GitHub merge messages without destroying the original tracker
            WORKING_MSG="$RAW_MSG"
            if echo "$RAW_MSG" | grep -q "^Merge pull request"; then
              WORKING_MSG=$(echo "$RAW_MSG" | sed -E 's/^Merge pull request #[0-9]+ from [^ ]+ //')
            fi
            
            # Deduplicate or strip raw number text from the core description string safely
            CLEAN_MSG=$(echo "$WORKING_MSG" | sed -E 's/[[:space:]]*\(?#[0-9]+\)?//g' | xargs)
            BULLET="- ${CLEAN_MSG}${PR_SUFFIX}"
            
            # Sort into matching typography category buckets
            if echo "$CLEAN_MSG" | grep -i -q "^feat"; then
              FEAT_CHANGES="${FEAT_CHANGES}\n${BULLET}"
            elif echo "$CLEAN_MSG" | grep -E -i -q '^fix|^bug'; then
              FIX_CHANGES="${FIX_CHANGES}\n${BULLET}"
            elif echo "$CLEAN_MSG" | grep -E -i -q '^chore|^docs|^refactor'; then
              CHORE_CHANGES="${CHORE_CHANGES}\n${BULLET}"
            else
              MISC_CHANGES="${MISC_CHANGES}\n${BULLET}"
            fi
          done < <(git log ${BASE}..HEAD --oneline)
          
          # 3. Complete SemVer Math calculations
          CLEAN_BASE="${BASE#v}"
          IFS='.' read -r major minor patch <<< "$CLEAN_BASE"
          
          if [ "$BUMP_DECISION" = "major" ]; then
            major=$((major + 1)); minor=0; patch=0
          elif [ "$BUMP_DECISION" = "minor" ]; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          
          NEW_TAG="v${major}.${minor}.${patch}"
          RAW_VERSION="${major}.${minor}.${patch}"
          
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "::error::Calculated target version '${NEW_TAG}' already exists."
            exit 1
          fi
          
          # 4. Update project version trackers
          sed -i -E "s/(__version__ *= *['\"])[^'\"]*(['\"])/\1${RAW_VERSION}\2/g" "tutoraspects/__about__.py"
          sed -i -E "s/(ASPECTS_VERSION\s*:\s*)[0-9]+\.[0-9]+\.[0-9]+/\1${RAW_VERSION}/g" ".ci/config.yml"
          
          # 5. Build full Markdown Text Block
          PR_MARKDOWN="## Changes since release ${BASE}"
          ENTRY_MARKDOWN=""
          
          if [ ! -z "$FEAT_CHANGES" ]; then
            PR_MARKDOWN="${PR_MARKDOWN}\n\n### Features${FEAT_CHANGES}"
            ENTRY_MARKDOWN="${ENTRY_MARKDOWN}\n### Features${FEAT_CHANGES}"
          fi
          if [ ! -z "$FIX_CHANGES" ]; then
            PR_MARKDOWN="${PR_MARKDOWN}\n\n### Bug Fixes${FIX_CHANGES}"
            ENTRY_MARKDOWN="${ENTRY_MARKDOWN}\n### Bug Fixes${FIX_CHANGES}"
          fi
          if [ ! -z "$CHORE_CHANGES" ]; then
            PR_MARKDOWN="${PR_MARKDOWN}\n\n### Maintenance & Refactoring${CHORE_CHANGES}"
            ENTRY_MARKDOWN="${ENTRY_MARKDOWN}\n### Maintenance & Refactoring${CHORE_CHANGES}"
          fi
          if [ -z "$FEAT_CHANGES" ] && [ -z "$FIX_CHANGES" ] && [ -z "$CHORE_CHANGES" ]; then
            PR_MARKDOWN="${PR_MARKDOWN}\n\n### Miscellaneous Updates${MISC_CHANGES}"
            ENTRY_MARKDOWN="${ENTRY_MARKDOWN}\n### Miscellaneous Updates${MISC_CHANGES}"
          fi
          
          # 6. Splice entry directly into CHANGELOG.md starting precisely on line 8
          C_FILE="CHANGELOG.md"
          [ ! -f "$C_FILE" ] && touch "$C_FILE"
          
          # Pad file if shorter than 7 lines to maintain structural integrity
          while [ $(wc -l < "$C_FILE") -lt 7 ]; do echo "" >> "$C_FILE"; done
          
          head -n 7 "$C_FILE" > changelog_spliced.md
          echo -e "\n# Release ${NEW_TAG} (${CURRENT_DATE})\n${ENTRY_MARKDOWN}\n\n---\n" >> changelog_spliced.md
          tail -n +8 "$C_FILE" >> changelog_spliced.md
          mv changelog_spliced.md "$C_FILE"
          
          # 7. Securely export environment parameters
          echo "new_tag=${NEW_TAG}" >> $GITHUB_OUTPUT
          echo "raw_version=${RAW_VERSION}" >> $GITHUB_OUTPUT
          echo "BODY<<EOF" >> $GITHUB_OUTPUT
          echo -e "${PR_MARKDOWN}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump version to ${{ steps.git_changelog.outputs.raw_version }} and update CHANGELOG [skip ci]"
          base: ${{ github.ref_name }} 
          branch: "release/${{ steps.git_changelog.outputs.new_tag }}"
          title: "Release ${{ steps.git_changelog.outputs.new_tag }}"
          body: |
            This PR prepares the release for version **${{ steps.git_changelog.outputs.new_tag }}** branching from base version `${{ inputs.base_tag }}`.
            
            The SemVer bump type was automatically calculated by parsing conventional commits merged into this branch.
            
            Once merged, the publication pipeline will trigger automatically.
            
            ### Proposed Release Notes:
            ${{ steps.git_changelog.outputs.BODY }}
          labels: |
            release-pr
