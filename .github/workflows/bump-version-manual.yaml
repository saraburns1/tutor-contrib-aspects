name: Bump Version (Manually)

on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: 'The previous release tag to base this new version on (e.g., v1.4.2)'
        required: true
      bump_type:
        description: 'SemVer increment type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  prepare-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Targeted Branch Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0 

      - name: Force Fetch Tags and Remote History
        run: |
          git fetch --tags --force origin
          git fetch origin ${{ github.ref_name }}

      - name: Calculate Next Version
        id: semver
        run: |
          BASE="${{ inputs.base_tag }}"
          BUMP="${{ inputs.bump_type }}"
          CLEAN_VER="${BASE#v}"
          
          IFS='.' read -r major minor patch <<< "$CLEAN_VER"
          
          if [ "$BUMP" = "major" ]; then
            major=$((major + 1)); minor=0; patch=0
          elif [ "$BUMP" = "minor" ]; then
            minor=$((minor + 1)); patch=0
          elif [ "$BUMP" = "patch" ]; then
            patch=$((patch + 1))
          fi
          
          NEXT_VERSION="v$major.$minor.$patch"
          RAW_VERSION="$major.$minor.$patch"
          
          if git rev-parse "$NEXT_VERSION" >/dev/null 2>&1; then
            echo "Error: Target version '$NEXT_VERSION' already exists."
            exit 1
          fi
          
          echo "new_tag=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "raw_version=$RAW_VERSION" >> $GITHUB_OUTPUT

      - name: Update Version in Project Files
        run: |
          NEW_V="${{ steps.semver.outputs.raw_version }}"
          
          # 1. Update Python Metadata File (Inside tutoraspects folder)
          PY_FILE="tutoraspects/__about__.py"
          if [ ! -f "$PY_FILE" ]; then
            echo "Error: $PY_FILE not found!"
            exit 1
          fi
          sed -i -E "s/(__version__ *= *['\"])[^'\"]*(['\"])/\1$NEW_V\2/g" "$PY_FILE"
          
          # 2. Update Continuous Integration Configuration
          YAML_FILE=".ci/config.yml"
          if [ ! -f "$YAML_FILE" ]; then
            echo "Error: $YAML_FILE not found!"
            exit 1
          fi
          sed -i -E "s/(ASPECTS_VERSION\s*:\s*)[0-9]+\.[0-9]+\.[0-9]+/\1$NEW_V/g" "$YAML_FILE"

      - name: Process Changelog Delta and Update Files
        id: git_changelog
        run: |
          BASE_TAG="${{ inputs.base_tag }}"
          NEW_TAG="${{ steps.semver.outputs.new_tag }}"
          CHANGELOG_FILE="CHANGELOG.md"
          CURRENT_DATE=$(date +%Y-%m-%d)
          
          if ! git rev-parse "$BASE_TAG" >/dev/null 2>&1; then
            echo "Error: Base tag $BASE_TAG does not exist in local git history."
            exit 1
          fi

          # 1. Build string outputs into memory variables
          FEAT_CHANGES=""
          FIX_CHANGES=""
          CHORE_CHANGES=""
          MISC_CHANGES=""
          
          # Read Git history directly via string stream without leaving any disk files behind
          while IFS= read -r line; do
            PR_MSG=$(echo "$line" | sed -E 's/^[a-f0-9]+ //')
            MISC_CHANGES="${MISC_CHANGES}\n- ${PR_MSG}"
            
            if [[ "$PR_MSG" =~ "feat" ]]; then
              FEAT_CHANGES="${FEAT_CHANGES}\n- ${PR_MSG}"
            elif [[ "$PR_MSG" =~ "fix" || "$PR_MSG" =~ "bug" ]]; then
              FIX_CHANGES="${FIX_CHANGES}\n- ${PR_MSG}"
            elif [[ "$PR_MSG" =~ "chore" || "$PR_MSG" =~ "docs" || "$PR_MSG" =~ "refactor" ]]; then
              CHORE_CHANGES="${CHORE_CHANGES}\n- ${PR_MSG}"
            fi
          done < <(git log ${BASE_TAG}..HEAD --oneline)

          # 2. Compile PR Body Context
          PR_MARKDOWN="## Changes since release $BASE_TAG"
          if [ ! -z "$FEAT_CHANGES" ]; then PR_MARKDOWN="${PR_MARKDOWN}\n\n### 🚀 Features${FEAT_CHANGES}"; fi
          if [ ! -z "$FIX_CHANGES" ]; then PR_MARKDOWN="${PR_MARKDOWN}\n\n### 🐛 Bug Fixes${FIX_CHANGES}"; fi
          if [ ! -z "$CHORE_CHANGES" ]; then PR_MARKDOWN="${PR_MARKDOWN}\n\n### 🧰 Maintenance & Refactoring${CHORE_CHANGES}"; fi
          if [ -z "$FEAT_CHANGES" ] && [ -z "$FIX_CHANGES" ] && [ -z "$CHORE_CHANGES" ]; then
            PR_MARKDOWN="${PR_MARKDOWN}\n\n### 📝 Miscellaneous Updates${MISC_CHANGES}"
          fi
          
          # 3. Compile CHANGELOG.md Entry Block
          ENTRY_MARKDOWN=""
          if [ ! -z "$FEAT_CHANGES" ]; then ENTRY_MARKDOWN="${ENTRY_MARKDOWN}\n### 🚀 Features${FEAT_CHANGES}"; fi
          if [ ! -z "$FIX_CHANGES" ]; then ENTRY_MARKDOWN="${ENTRY_MARKDOWN}\n### 🐛 Bug Fixes${FIX_CHANGES}"; fi
          if [ ! -z "$CHORE_CHANGES" ]; then ENTRY_MARKDOWN="${ENTRY_MARKDOWN}\n### 🧰 Maintenance & Refactoring${CHORE_CHANGES}"; fi
          if [ -z "$FEAT_CHANGES" ] && [ -z "$FIX_CHANGES" ] && [ -z "$CHORE_CHANGES" ]; then
            ENTRY_MARKDOWN="${ENTRY_MARKDOWN}\n### 📝 Miscellaneous Updates${MISC_CHANGES}"
          fi

          # 4. Prepend directly to CHANGELOG.md using inline stacking
          if [ ! -f "$CHANGELOG_FILE" ]; then touch "$CHANGELOG_FILE"; fi
          echo -e "# Release ${NEW_TAG} (${CURRENT_DATE})\n${ENTRY_MARKDOWN}\n\n---\n\n$(cat $CHANGELOG_FILE)" > "$CHANGELOG_FILE"

          # 5. Output values safely to runner memory environment
          echo "BODY<<EOF" >> $GITHUB_OUTPUT
          echo -e "$PR_MARKDOWN" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump version to ${{ steps.semver.outputs.raw_version }} and update CHANGELOG [skip ci]"
          base: ${{ github.ref_name }} 
          branch: "release/${{ steps.semver.outputs.new_tag }}"
          title: "Release ${{ steps.semver.outputs.new_tag }}"
          body: |
            This PR prepares the release for version **${{ steps.semver.outputs.new_tag }}** branching from base version `${{ inputs.base_tag }}`.
            
            Once merged, the publication pipeline will trigger automatically.
            
            ### Proposed Release Notes:
            ${{ steps.git_changelog.outputs.BODY }}
          labels: |
            release-pr
